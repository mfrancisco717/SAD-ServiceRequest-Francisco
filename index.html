<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ICT Service Request System
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- =====================================
         TOP BAR
    ====================================== -->

    <header class="topbar">

        <div>

            <h1>
                ICT Service Request System
            </h1>

            <p>
                Service Request Management Dashboard
            </p>

        </div>


        <button
            id="logoutBtn"
            class="logout-btn"
        >
            Logout
        </button>

    </header>



    <main class="container">


        <!-- =====================================
             DASHBOARD
        ====================================== -->

        <section class="dashboard">


            <!-- Total Requests -->

            <div class="stat-card">

                <h3>
                    Total Requests
                </h3>

                <p id="totalRequests">
                    0
                </p>

            </div>



            <!-- Pending -->

            <div class="stat-card">

                <h3>
                    Pending
                </h3>

                <p id="pendingRequests">
                    0
                </p>

            </div>



            <!-- In Progress -->

            <div class="stat-card">

                <h3>
                    In Progress
                </h3>

                <p id="inProgressRequests">
                    0
                </p>

            </div>



            <!-- Completed -->

            <div class="stat-card">

                <h3>
                    Completed
                </h3>

                <p id="completedRequests">
                    0
                </p>

            </div>


        </section>



        <!-- =====================================
             SUBMIT SERVICE REQUEST
        ====================================== -->

        <section class="form-section">


            <div class="section-header">

                <h2>
                    Submit Service Request
                </h2>

            </div>



            <form id="requestForm">


                <div class="form-grid">


                    <!-- Requester Name -->

                    <div class="form-group">

                        <label for="requesterName">
                            Requester Name
                        </label>


                        <input
                            type="text"
                            id="requesterName"
                            placeholder="Enter requester name"
                            required
                        >

                    </div>



                    <!-- Department -->

                    <div class="form-group">

                        <label for="department">
                            Department
                        </label>


                        <input
                            type="text"
                            id="department"
                            placeholder="Enter department"
                            required
                        >

                    </div>



                    <!-- Category -->

                    <div class="form-group">

                        <label for="category">
                            Category
                        </label>


                        <select
                            id="category"
                            required
                        >

                            <option value="">
                                Select category
                            </option>


                            <option value="Computer Repair">
                                Computer Repair
                            </option>


                            <option value="Software Installation">
                                Software Installation
                            </option>


                            <option value="Network Problem">
                                Network Problem
                            </option>


                            <option value="Printer Problem">
                                Printer Problem
                            </option>


                            <option value="Account/Access Concern">
                                Account/Access Concern
                            </option>


                            <option value="Other">
                                Other
                            </option>


                        </select>

                    </div>



                    <!-- Priority -->

                    <div class="form-group">

                        <label for="priority">
                            Priority
                        </label>


                        <select
                            id="priority"
                            required
                        >

                            <option value="">
                                Select priority
                            </option>


                            <option value="Low">
                                Low
                            </option>


                            <option value="Medium">
                                Medium
                            </option>


                            <option value="High">
                                High
                            </option>


                        </select>

                    </div>


                </div>



                <!-- Description -->

                <div class="form-group">


                    <label for="description">
                        Description
                    </label>


                    <textarea
                        id="description"
                        rows="4"
                        placeholder="Describe the ICT problem..."
                        required
                    ></textarea>


                </div>



                <!-- Submit Button -->

                <button
                    type="submit"
                    class="primary-btn"
                >
                    Submit Request
                </button>


            </form>


        </section>



        <!-- =====================================
             SERVICE REQUESTS
        ====================================== -->

        <section class="requests-section">


            <div class="section-header">

                <h2>
                    Service Requests
                </h2>

            </div>



            <!-- =====================================
                 SEARCH AND FILTERS
            ====================================== -->

            <div class="filters">


                <!-- Search -->

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search requester or description..."
                >



                <!-- Status Filter -->

                <select id="statusFilter">


                    <option value="All">
                        All Status
                    </option>


                    <option value="Pending">
                        Pending
                    </option>


                    <option value="In Progress">
                        In Progress
                    </option>


                    <option value="Completed">
                        Completed
                    </option>


                </select>



                <!-- Priority Filter -->

                <select id="priorityFilter">


                    <option value="All">
                        All Priority
                    </option>


                    <option value="Low">
                        Low
                    </option>


                    <option value="Medium">
                        Medium
                    </option>


                    <option value="High">
                        High
                    </option>


                </select>


            </div>



            <!-- =====================================
                 REQUEST TABLE
            ====================================== -->

            <div class="table-container">


                <table>


                    <thead>

                        <tr>

                            <th>
                                ID
                            </th>

                            <th>
                                Requester
                            </th>

                            <th>
                                Department
                            </th>

                            <th>
                                Category
                            </th>

                            <th>
                                Priority
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Date Requested
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>



                    <tbody id="requestTableBody">

                        <!-- Requests will appear here -->

                    </tbody>


                </table>


            </div>


        </section>


    </main>



    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <!-- Supabase Library -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- Supabase Configuration -->

    <script
        src="js/supabase.js"
    ></script>


    <!-- Authentication -->

    <script
        src="js/auth.js"
    ></script>


    <!-- Application -->

    <script
        src="js/app.js"
    ></script>


</body>

</html>
